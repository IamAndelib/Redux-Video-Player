# L3 player core (VLC's own tests in test/, run by meson test).
- id: L3-eof-stays
  title: The last video ends paused on its last frame
  layer: L3
  milestone: M0.6
  sources: [scope:K6, accept:M0.6]
  expected: with play-and-pause the player pauses at the end and stays paused.
  check: l3.test_src_player_eof

- id: L3-restart-after-end
  title: Play on a finished video starts it from the beginning; a seek in between wins
  layer: L3
  milestone: Q0.1
  sources: [scope:K7, decision:D21]
  expected: resuming at the end plays from near 0; after a seek it resumes from the seek position.
  check: l3.test_src_player_eof

